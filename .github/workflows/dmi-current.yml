name: Fetch DMI current & water level

# Kører automatisk hver dag kl. 11:00 UTC (13:00 dansk sommertid / 12:00 vintertid),
# og kan også køres manuelt fra GitHub ("Run workflow").
#
# Tidspunktet er flyttet fra kl. 05:00 UTC (07:00 sommertid) den 16/9-2026:
# de sidste 5 morgenkørsler havde alle mindst ét (ofte to) af de tre DMI-kald
# fejle, mens den eneste kørsel midt på dagen i samme periode (kl. 13:10
# lokal) lykkedes for alle tre. Formodning: DMI's egen havmodel bliver
# publiceret omkring den tidlige morgentime, og/eller mange andre
# automatiske jobs rammer DMI's API på samme runde klokkeslæt. Hold øje med
# data/fetch-status.json fremover for at se, om flytningen faktisk hjælper.
#
# Udvidet 17/9-2026 med to nye kald til DMI's "Oceanographic Observation and
# Tidewater API" (v2/oceanObs), der giver live vandtemperatur fra rigtige
# målestationer - som supplement til strøm/vandstand-prognosen fra
# forecastedr-modellen ovenfor. Denne API kræver (siden DMI fjernede krav om
# API-nøgle 2/12-2025) ingen nøgle overhovedet. Testet manuelt 17/9-2026:
# station 30333 (Kastrup Havn II) og 30334 (Københavns Havn II) leverer
# begge friske målinger med ca. 10 minutters mellemrum.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DMI ocean forecast (Amager Strand + Nordhavn/Sandkaj + Kattegatvej/Nordhavn Havsvømmebane)
        run: |
          mkdir -p data
          START=$(date -u +%Y-%m-%dT%H:00:00Z)
          END=$(date -u -d "+72 hours" +%Y-%m-%dT%H:00:00Z)

          # -f gør, at curl regner en HTTP-fejl (fx 429) som en fejl i sig selv,
          # i stedet for bare at gemme fejlsiden som om det var rigtige data.
          # -A sætter en almindelig browser-lignende User-Agent, da nogle
          # tjenester ellers afviser curl's standard-UA.
          # --connect-timeout 10 sætter et loft på 10 sekunder for selve det at
          # oprette forbindelsen; --max-time 30 sætter et loft på 30 sekunder
          # for HELE kaldet (DNS+forbindelse+svar). Tilføjet 19/9-2026, fordi
          # der ellers ikke var noget loft: hvis DMI tog imod forbindelsen men
          # aldrig svarede, kunne ét enkelt forsøg i praksis hænge langt ud
          # over de bevidste random_pause-ventetider nedenfor.
          #
          # Retry-logikken er (19/9-2026) flyttet fra curl's indbyggede
          # --retry/--retry-delay (som kun tillader ÉN fast ventetid mellem
          # forsøg) til en håndskrevet løkke nedenfor, så ventetiden mellem
          # forsøg kan gøres tilfældig i stedet for helt periodisk - se
          # begrundelsen ved random_pause/fetch_one nedenfor.
          CURL_OPTS="-f -sS -A Mozilla/5.0 --connect-timeout 10 --max-time 30"
          MAX_ATTEMPTS=6

          # Samler status for hvert punkt op, så vi kan skrive en samlet
          # data/fetch-status.json i slutningen - så det er synligt uden at
          # skulle grave i commit-historik eller Actions-logs (som kræver
          # login for at se i fuld længde), hvilket af punkterne der rent
          # faktisk lykkedes i denne kørsel.
          STATUS=()

          # Tilfældig ventetid i intervallet [min,max] sekunder (inklusive).
          # Bruges både mellem retry-forsøg på samme kald og mellem de 5
          # forskellige kald, så vi ikke rammer DMI med et helt forudsigeligt,
          # metronom-agtigt mønster hver dag på præcis samme sekund-afstande -
          # hvis den observerede 429-throttling (se dmi-pi-automation-noterne)
          # hænger sammen med andre automatiske jobs, der selv kører i et
          # fast mønster, mindsker jitter chancen for at vi konsekvent rammer
          # samme smalle congestion-vindue hver dag.
          random_pause() {
            local min="$1" max="$2" d
            d=$(( (RANDOM % (max - min + 1)) + min ))
            echo "Venter ${d}s..."
            sleep "$d"
          }

          # Henter til en midlertidig .tmp-fil og erstatter kun den rigtige fil,
          # hvis hentningen lykkedes - så en fejlet hentning aldrig overskriver
          # gode, tidligere data med en fejlbesked. Prøver op til MAX_ATTEMPTS
          # gange med en tilfældig pause (5-25s) mellem forsøg ved fejl.
          fetch_one() {
            local key="$1" label="$2" url="$3" outfile="$4"
            local attempt=1
            while (( attempt <= MAX_ATTEMPTS )); do
              if curl $CURL_OPTS "$url" -o "${outfile}.tmp"; then
                mv "${outfile}.tmp" "$outfile"
                echo "OK: $label (forsøg $attempt/$MAX_ATTEMPTS)"
                STATUS+=("{\"key\":\"$key\",\"label\":$(jq -Rn --arg l "$label" '$l'),\"status\":\"ok\"}")
                return
              fi
              rm -f "${outfile}.tmp"
              if (( attempt < MAX_ATTEMPTS )); then
                echo "Forsøg $attempt/$MAX_ATTEMPTS fejlede for $label - venter og prøver igen" >&2
                random_pause 5 25
              fi
              (( attempt++ ))
            done
            echo "ADVARSEL: kunne ikke hente $label efter $MAX_ATTEMPTS forsøg - beholder tidligere data i $outfile" >&2
            STATUS+=("{\"key\":\"$key\",\"label\":$(jq -Rn --arg l "$label" '$l'),\"status\":\"failed\"}")
          }

          # Amager Strand (svømmerutens midtpunkt)
          fetch_one "amager" "Amager Strand (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.6428%2055.6610)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/amager-current.json

          # Pause mellem kaldene, så vi ikke rammer DMI's delte fair-use-grænse
          # ved at sende kaldene lige efter hinanden. Øget fra 10 til 30
          # sekunder (16/9-2026), og fra fast 30s til tilfældig 20-40s
          # (19/9-2026, se random_pause ovenfor) i forsøg på at undgå
          # rate-limit-relaterede udfald, som ramte 2 ud af 3 punkter i næsten
          # alle morgenkørsler.
          random_pause 20 40

          # Nordhavnens svømmebane (Sandkaj Badezone)
          fetch_one "nordhavn" "Nordhavn/Sandkaj Badezone (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.5973%2055.7065)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/nordhavn-current.json

          random_pause 20 40

          # Nordhavnens Havsvømmebane (Kattegatvej 59) - punktet er flyttet ca.
          # 350-400 m ud i havnemundingen fra selve adressen, fordi DMI's
          # havmodel ikke har gyldige data helt inde ved kajkanten (testet
          # 13/9-2026: adressens eget koordinat gav kun null-værdier).
          fetch_one "kattegatvej" "Nordhavn Havsvømmebane/Kattegatvej (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.6150%2055.7200)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/kattegatvej-current.json

          random_pause 20 40

          # Live vandtemperatur fra DMI's oceanObs-API (rigtige målestationer,
          # ikke en model) - ingen API-nøgle nødvendig. "period=latest" giver
          # præcis én, den nyeste, måling. Kastrup Havn II (station 30333)
          # dækker Amager Strand; Københavns Havn II (station 30334) dækker
          # både Nordhavn/Sandkaj Badezone og Kattegatvej/Nordhavn
          # Havsvømmebane (samme station brugt til alle tre, ligesom den
          # manuelle dmi.dk/havtemperatur-opslag hidtil har gjort).
          fetch_one "amager_watertemp" "Amager Strand (live vandtemp, Kastrup Havn II)" \
            "https://opendataapi.dmi.dk/v2/oceanObs/collections/observation/items?stationId=30333&parameterId=tw&period=latest" \
            data/amager-watertemp.json

          random_pause 10 20

          fetch_one "nordhavn_watertemp" "Nordhavn/Sandkaj/Kattegatvej (live vandtemp, Københavns Havn II)" \
            "https://opendataapi.dmi.dk/v2/oceanObs/collections/observation/items?stationId=30334&parameterId=tw&period=latest" \
            data/nordhavn-watertemp.json

          # Skriver samlet status for denne kørsel - ét blik afslører, om et
          # eller flere punkter fejlede, uden at skulle sammenligne datofiler
          # eller læse Actions-logs.
          printf '%s\n' "${STATUS[@]}" | jq -s --arg run_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{run_at: $run_at, points: (map({(.key): {label: .label, status: .status}}) | add)}' \
            > data/fetch-status.json

      - name: Write timestamp
        run: |
          # Badevandskvalitet kunne ikke hentes pålideligt fra nogen af de
          # forsøgte kilder (badevand.dk, vandudsigten.dk, badevand.com) -
          # de blokerer alle tilsyneladende trafik fra cloud/datacenter-IP'er
          # som GitHub Actions'. Det tjekkes derfor fortsat manuelt/interaktivt
          # i stedet. Denne workflow henter kun DMI's strøm/vandstand-data og
          # (siden 17/9-2026) live vandtemperatur.
          #
          # NB: dette tidsstempel opdateres altid, uanset om et eller flere
          # af DMI-kaldene ovenfor fejlede - det viser kun, at workflowet
          # kørte, ikke at alle punkters data er friske. Brug
          # data/fetch-status.json for status pr. punkt.
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last-updated.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update swim conditions data"
          git pull --rebase origin main
          git push
