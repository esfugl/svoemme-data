name: Fetch DMI current & water level

# Kører automatisk hver dag kl. 05:00 UTC (07:00 dansk sommertid),
# og kan også køres manuelt fra GitHub ("Run workflow").
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DMI ocean forecast (Amager Strand + Nordhavn/Sandkaj + Hesselbjerg)
        run: |
          mkdir -p data
          START=$(date -u +%Y-%m-%dT%H:00:00Z)
          END=$(date -u -d "+72 hours" +%Y-%m-%dT%H:00:00Z)

          # -f gør, at curl regner en HTTP-fejl (fx 429) som en fejl i sig selv,
          # i stedet for bare at gemme fejlsiden som om det var rigtige data.
          # --retry-all-errors får curl til at forsøge igen ved den slags fejl
          # (ikke kun ved forbindelsesfejl), med stigende ventetid mellem forsøg.
          # -A sætter en almindelig browser-lignende User-Agent, da nogle
          # tjenester ellers afviser curl's standard-UA.
          CURL_OPTS="--retry 6 --retry-delay 15 --retry-all-errors -f -sS -A Mozilla/5.0"

          # Henter til en midlertidig .tmp-fil og erstatter kun den rigtige fil,
          # hvis hentningen lykkedes - så en fejlet hentning aldrig overskriver
          # gode, tidligere data med en fejlbesked.
          fetch_one() {
            local label="$1" url="$2" outfile="$3"
            if curl $CURL_OPTS "$url" -o "${outfile}.tmp"; then
              mv "${outfile}.tmp" "$outfile"
              echo "OK: $label"
            else
              echo "ADVARSEL: kunne ikke hente $label - beholder tidligere data i $outfile" >&2
              rm -f "${outfile}.tmp"
            fi
          }

          # Amager Strand (svømmerutens midtpunkt)
          fetch_one "Amager Strand (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.6428%2055.6610)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/amager-current.json

          # Lille pause mellem kaldene, så vi ikke rammer DMI's delte
          # fair-use-grænse ved at sende tre kald lige efter hinanden.
          sleep 10

          # Nordhavnens svømmebane (Sandkaj Badezone)
          fetch_one "Nordhavn (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.5973%2055.7065)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/nordhavn-current.json

          sleep 10

          # Hesselbjerg Strand, Langeland (kun til ad hoc-tjek)
          fetch_one "Hesselbjerg (DMI strøm/vandstand)" \
            "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(10.6549%2054.8019)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
            data/hesselbjerg-current.json

      - name: Write timestamp
        run: |
          # Badevandskvalitet kunne ikke hentes pålideligt fra nogen af de
          # forsøgte kilder (badevand.dk, vandudsigten.dk, badevand.com) -
          # de blokerer alle tilsyneladende trafik fra cloud/datacenter-IP'er
          # som GitHub Actions'. Det tjekkes derfor fortsat manuelt/interaktivt
          # i stedet. Denne workflow henter kun DMI's strøm/vandstand-data.
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last-updated.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update swim conditions data"
          git pull --rebase origin main
          git push
