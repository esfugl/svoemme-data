---
name: Fetch DMI current & water level

# Historik (kort - den fulde baggrund står i dmi-pi-automation-hukommelsen
# og i commit-historikken):
# - 16-19/9-2026: tidspunkt flyttet, to daglige kørsler, 6 forsøg med
#   tilfældig pause mellem forsøg (jitter), live vandtemp fra DMI's
#   oceanObs (stationerne 30333 Kastrup Havn II, 30334 Københavns Havn II,
#   30479 Køge Havn II - 30478 er død), Valkyrien tilføjet (badebroens
#   koordinat), Kattegatvej-punktet flyttet ca. 350-400 m ud i havnemundingen
#   (adressens eget punkt giver null i DMI's havmodel).
# - 23/9-2026: prognosevindue 72 -> 36 timer (halv svarstørrelse, samme
#   antal kald). Gælder kun denne pipelines cache (data/*-current.json).
# - 27/9-2026: cron-job.org starter kørslerne via workflow_dispatch (GitHub's
#   egen tidsplan er blevet upålidelig); run-name viser startkilden;
#   concurrency-gruppe og push-retry (kørsel #68/#69 kolliderede).
#
# NYT 4/10-2026 (udkast): kørslen kan afgrænses til bestemte lokationer via
# inputtet "locations" (kommasepareret: amager, nordhavn, kattegatvej,
# valkyrien, svaneknoppen - eller "alle"). Svaneknoppen (Svanemøllebugtens
# Vinterbadelaug, København Ø) er tilføjet som ny lokation. Vandtemp-kald
# deles: station 30334 dækker nordhavn, kattegatvej og svaneknoppen, så den
# hentes kun én gang pr. kørsel. data/fetch-status.json bliver nu FLETTET
# pr. punkt (hvert punkt har sit eget run_at), så en kørsel med kun
# "amager" ikke sletter status for de øvrige punkter.
run-name: "${{ github.event_name == 'schedule' && 'DMI - GitHub-tidsplan (reserve)' || format('DMI - {0}', inputs.source || 'manuel') }}"

on:
  # GitHub's egen tidsplan er kun reserve (cron-job.org er primær). Kørsler
  # fra tidsplanen har intet "locations"-input og henter derfor alle punkter.
  schedule:
    - cron: '47 10 * * *'  # ca. kl. 12:47 dansk sommertid / 11:47 vintertid
    - cron: '13 16 * * *'  # ca. kl. 18:13 dansk sommertid / 17:13 vintertid
  workflow_dispatch:
    inputs:
      source:
        description: 'Hvem starter kørslen (vises i Actions-listen)'
        required: false
        default: 'manuel'
        type: string
      locations:
        description: 'Lokationer: alle, eller kommasepareret liste (amager,nordhavn,kattegatvej,valkyrien,svaneknoppen)'
        required: false
        default: 'alle'
        type: string

permissions:
  contents: write

# Højst én DMI-kørsel ad gangen: en ny kørsel venter i kø, mens en anden kører.
concurrency:
  group: dmi-current
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch DMI ocean forecast and water temperature (valgte lokationer)
        env:
          LOCATIONS_INPUT: ${{ inputs.locations }}
        run: |
          mkdir -p data
          START=$(date -u +%Y-%m-%dT%H:00:00Z)
          END=$(date -u -d "+36 hours" +%Y-%m-%dT%H:00:00Z)

          # Hvilke lokationer skal med i denne kørsel? Tom/manglende = alle.
          LOCATIONS="${LOCATIONS_INPUT:-alle}"
          LOC=",$(echo "$LOCATIONS" | tr 'A-Z' 'a-z' | tr -d ' '),"
          echo "Lokationer i denne kørsel: $LOCATIONS"
          want() { [[ "$LOC" == *",alle,"* || "$LOC" == *",$1,"* ]]; }

          # -f: en HTTP-fejl (fx 429) tæller som fejl i sig selv.
          # -A: browser-lignende User-Agent. Loft på 10 s for forbindelsen og
          # 30 s for hele kaldet, så et enkelt forsøg ikke kan hænge.
          CURL_OPTS="-f -sS -A Mozilla/5.0 --connect-timeout 10 --max-time 30"
          MAX_ATTEMPTS=6

          # Status pr. punkt i denne kørsel (flettes ind i data/fetch-status.json).
          STATUS=()

          # Tilfældig ventetid [min,max] sekunder, så vi ikke rammer DMI i et
          # metronom-agtigt mønster.
          random_pause() {
            local min="$1" max="$2" d
            d=$(( (RANDOM % (max - min + 1)) + min ))
            echo "Venter ${d}s..."
            sleep "$d"
          }

          # Pause mellem kald - men ikke før det allerførste kald i kørslen.
          FIRST=1
          gap() {
            if (( FIRST )); then
              FIRST=0
            else
              random_pause "$1" "$2"
            fi
          }

          # Henter til .tmp og erstatter kun den rigtige fil ved succes, så en
          # fejlet hentning aldrig overskriver gode data. Op til MAX_ATTEMPTS
          # forsøg med tilfældig pause (5-25 s) imellem.
          fetch_one() {
            local key="$1" label="$2" url="$3" outfile="$4"
            local attempt=1
            while (( attempt <= MAX_ATTEMPTS )); do
              if curl $CURL_OPTS "$url" -o "${outfile}.tmp"; then
                mv "${outfile}.tmp" "$outfile"
                echo "OK: $label (forsøg $attempt/$MAX_ATTEMPTS)"
                STATUS+=("{\"key\":\"$key\",\"label\":$(jq -Rn --arg l "$label" '$l'),\"status\":\"ok\"}")
                return
              fi
              rm -f "${outfile}.tmp"
              if (( attempt < MAX_ATTEMPTS )); then
                echo "Forsøg $attempt/$MAX_ATTEMPTS fejlede for $label - venter og prøver igen" >&2
                random_pause 5 25
              fi
              (( attempt++ ))
            done
            echo "ADVARSEL: kunne ikke hente $label efter $MAX_ATTEMPTS forsøg - beholder tidligere data i $outfile" >&2
            STATUS+=("{\"key\":\"$key\",\"label\":$(jq -Rn --arg l "$label" '$l'),\"status\":\"failed\"}")
          }

          # --- Strøm og vandstand (DMI forecastedr / dkss_idw) ---

          if want amager; then
            gap 20 40
            # Amager Strand (svømmerutens midtpunkt)
            fetch_one "amager" "Amager Strand (DMI strøm/vandstand)" \
              "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.6428%2055.6610)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
              data/amager-current.json
          fi

          if want nordhavn; then
            gap 20 40
            # Nordhavn / Sandkaj Badezone
            fetch_one "nordhavn" "Nordhavn/Sandkaj Badezone (DMI strøm/vandstand)" \
              "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.5973%2055.7065)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
              data/nordhavn-current.json
          fi

          if want kattegatvej; then
            gap 20 40
            # Nordhavn Havsvømmebane (Kattegatvej 59) - punktet er flyttet ca.
            # 350-400 m ud i havnemundingen, fordi adressens eget punkt giver
            # null i DMI's havmodel.
            fetch_one "kattegatvej" "Nordhavn Havsvømmebane/Kattegatvej (DMI strøm/vandstand)" \
              "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.6150%2055.7200)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
              data/kattegatvej-current.json
          fi

          if want svaneknoppen; then
            gap 20 40
            # Svaneknoppen 7, København Ø - Svanemøllebugtens Vinterbadelaugs
            # badebro (55.7185075N 12.5889338E, oplyst af Esben 4/10-2026).
            fetch_one "svaneknoppen" "Svaneknoppen/Svanemøllen (DMI strøm/vandstand)" \
              "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.5889338%2055.7185075)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
              data/svaneknoppen-current.json
          fi

          if want valkyrien; then
            gap 20 40
            # Valkyrien (Køge) - koordinatet er badebroen, ikke klubhuset.
            fetch_one "valkyrien" "Valkyrien/Køge (DMI strøm/vandstand)" \
              "https://opendataapi.dmi.dk/v1/forecastedr/collections/dkss_idw/position?coords=POINT(12.1992778%2055.4493889)&crs=crs84&parameter-name=current-1m-u,current-1m-v,sea-mean-deviation&datetime=${START}/${END}&f=GeoJSON" \
              data/valkyrien-current.json
          fi

          # --- Live vandtemperatur (DMI oceanObs, målestationer, ingen nøgle) ---

          if want amager; then
            gap 10 20
            # Kastrup Havn II (30333) dækker Amager Strand.
            fetch_one "amager_watertemp" "Amager Strand (live vandtemp, Kastrup Havn II)" \
              "https://opendataapi.dmi.dk/v2/oceanObs/collections/observation/items?stationId=30333&parameterId=tw&period=latest" \
              data/amager-watertemp.json
          fi

          if want nordhavn || want kattegatvej || want svaneknoppen; then
            gap 10 20
            # Københavns Havn II (30334) dækker Nordhavn/Sandkaj, Kattegatvej
            # og Svaneknoppen - ét kald til alle tre.
            fetch_one "nordhavn_watertemp" "Nordhavn/Sandkaj/Kattegatvej/Svaneknoppen (live vandtemp, Københavns Havn II)" \
              "https://opendataapi.dmi.dk/v2/oceanObs/collections/observation/items?stationId=30334&parameterId=tw&period=latest" \
              data/nordhavn-watertemp.json
          fi

          if want valkyrien; then
            gap 10 20
            # Køge Havn II (30479) dækker Valkyrien.
            fetch_one "valkyrien_watertemp" "Valkyrien/Køge (live vandtemp, Køge Havn II)" \
              "https://opendataapi.dmi.dk/v2/oceanObs/collections/observation/items?stationId=30479&parameterId=tw&period=latest" \
              data/valkyrien-watertemp.json
          fi

          # Intet valgt (fx stavefejl i locations)? Fejl tydeligt i stedet for
          # at skrive en tom status.
          if (( ${#STATUS[@]} == 0 )); then
            echo "FEJL: ingen lokationer matchede '$LOCATIONS'" >&2
            exit 1
          fi

          # Flet status ind i data/fetch-status.json: punkter fra DENNE kørsel
          # overskrives (med eget run_at), øvrige punkter bevares uændret.
          # run_at øverst = tidspunktet for den seneste kørsel.
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          OLD='{}'
          if [ -s data/fetch-status.json ]; then
            OLD=$(jq -c '.points // {}' data/fetch-status.json 2>/dev/null || echo '{}')
          fi
          NEW=$(printf '%s\n' "${STATUS[@]}" | jq -s --arg ts "$NOW" \
            'map({(.key): {label: .label, status: .status, run_at: $ts}}) | add')
          jq -n --arg run_at "$NOW" --argjson old "$OLD" --argjson new "$NEW" \
            '{run_at: $run_at, points: ($old + $new)}' > data/fetch-status.json

      - name: Write timestamp
        run: |
          # Tidsstemplet opdateres altid, også hvis DMI-kald fejlede - det
          # viser kun at workflowet kørte. Brug data/fetch-status.json for
          # status pr. punkt (nu med eget run_at pr. punkt).
          date -u +%Y-%m-%dT%H:%M:%SZ > data/last-updated.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update swim conditions data"
          # Op til 4 forsøg: ditbadevand-workflowet skriver til samme repo
          # hver time, så et push kan blive afvist - hent og prøv igen.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "Push-forsøg $i fejlede - prøver igen"
            sleep $((RANDOM % 20 + 10))
          done
          echo "Push fejlede efter 4 forsøg"
          exit 1
